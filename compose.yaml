name: ${COMPOSE_PROJECT_NAME}

x-logging: &logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-100m}"
    max-file: "${LOG_MAX_FILE:-3}"

# 引擎公共部分：进程即 vLLM（PID 1），信号直传，无 supervisor
x-engine: &engine
  image: ${VLLM_IMAGE}
  network_mode: host
  restart: "no"
  stop_grace_period: ${STOP_GRACE:-120s}
  cap_add:
    - IPC_LOCK
  ulimits:
    memlock: -1
    nofile: 1048576
  logging: *logging
  volumes:
    - ${STACK_DIR}:/opt/vllm:ro
    - ${MODEL_ROOT}:${MODEL_ROOT}:ro
    - ${CACHE_ROOT}:/root/.cache
    - /usr/local/dcmi:/usr/local/dcmi
    - /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool
    - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
    - /usr/local/Ascend/driver/lib64:/usr/local/Ascend/driver/lib64
    - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info
    - /etc/ascend_install.info:/etc/ascend_install.info
    - /etc/hccn.conf:/etc/hccn.conf
    - mmc-shm:/dev/shm

services:
  # ---- KV 元数据基础设施 ----
  kv-master:
    image: ${VLLM_IMAGE}
    network_mode: host
    restart: unless-stopped
    logging: *logging
    volumes:
      - ${STACK_DIR}:/opt/vllm:ro
    command:
      - mooncake_master
      - --port
      - "50088"
      - --eviction_high_watermark_ratio
      - "0.9"
      - --eviction_ratio
      - "0.1"
      - --default_kv_lease_ttl
      - "11000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket;socket.create_connection(('127.0.0.1',50088),2)\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  kv-meta:
    image: ${VLLM_IMAGE}
    network_mode: host
    restart: unless-stopped
    logging: *logging
    volumes:
      - ${STACK_DIR}:/opt/vllm:ro
    environment:
      MMC_META_CONFIG_PATH: /opt/vllm/hosts/${HOST_ID}/mmc-meta.conf
      MMC_LOCAL_CONFIG_PATH: /opt/vllm/hosts/${HOST_ID}/mmc-local.conf
    command: ["python3", "-c", "from memcache_hybrid import MetaService; MetaService.main()"]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket;socket.create_connection(('127.0.0.1',5000),2)\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ---- 推理引擎 ----
  prefill:
    <<: *engine
    entrypoint: ["/bin/bash", "/opt/vllm/engine/prefill.sh"]
    depends_on:
      kv-master:
        condition: service_healthy
      kv-meta:
        condition: service_healthy
    env_file:
      - env/common.env
      - hosts/${HOST_ID}/runtime.env
      - hosts/${HOST_ID}/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${P_PORT}/health >/dev/null || exit 1"]
      interval: 5s
      start_interval: 2s
      timeout: 3s
      retries: 3
      start_period: ${HEALTH_MAX_WAIT:-30m}

  decode:
    <<: *engine
    entrypoint: ["/bin/bash", "/opt/vllm/engine/decode.sh"]
    depends_on:
      kv-master:
        condition: service_healthy
      kv-meta:
        condition: service_healthy
    env_file:
      - env/common.env
      - hosts/${HOST_ID}/runtime.env
      - hosts/${HOST_ID}/.env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${D_PORT}/health >/dev/null || exit 1"]
      interval: 5s
      start_interval: 2s
      timeout: 3s
      retries: 3
      start_period: ${HEALTH_MAX_WAIT:-30m}

  # ---- PD 编排（shim）----
  # vllm-router 0.1.17 的 Mooncake 模式要求 prefill 在 8998 提供 /query bootstrap，
  # 而 vllm-ascend 的 MooncakeConnectorV1 不提供；shim 直接转发 prefill 响应里的
  # kv_transfer_params，已在旧部署验证。
  router:
    image: ${VLLM_IMAGE}
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
    depends_on:
      prefill:
        condition: service_healthy
      decode:
        condition: service_healthy
    volumes:
      - ${STACK_DIR}:/opt/vllm:ro
    environment:
      LB_PROXY_LOG_FILE: /tmp/pd_proxy.log
    command:
      - python3
      - /opt/vllm/shim/pd_proxy.py
      - --host
      - ${BIND_IP}
      - --port
      - "${ROUTER_PORT}"
      - --prefiller-host
      - ${BIND_IP}
      - --prefiller-port
      - "${P_PORT}"
      - --decoder-host
      - ${BIND_IP}
      - --decoder-port
      - "${D_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://${BIND_IP}:${ROUTER_PORT}/healthcheck >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  mmc-shm:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "size=${MMC_SHM_SIZE:-820g},mode=1777"
